name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          python-version: "3.12"
          install-extras: "dev,pipeline"

      - uses: dataciviclab/.github/actions/python-ci@main
        with:
          lint_paths: "tests/ dashboard/ datasets/ compose/ scripts/"
          mypy_paths: ""
          test_dir: "tests"
          pytest_args: "-v --tb=short"

  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          python-version: "3.12"
          install-extras: "dev,pipeline"

      - name: Preflight dataset.yml + compose
        env:
          TOOLKIT_ALLOW_SCRIPT_SOURCE: "1"
        run: |
          set -euo pipefail
          mapfile -t CONFIGS < <(find datasets compose -name dataset.yml | sort)
          echo "→ ${#CONFIGS[@]} config da validare"
          for f in "${CONFIGS[@]}"; do
            echo "-> $f"
            toolkit run preflight --config "$f"
          done
          echo "✅ All configs valid"
