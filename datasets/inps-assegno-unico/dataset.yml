root: "../../out"
schema_version: 1

dataset:
  name: "inps_assegno_unico"
  source_id: "inps"
  tags: [welfare, inps, assegno-unico, famiglia]
  category: welfare
  description: "Assegno Unico Universale: figli e nuclei beneficiari per regione, ISEE, disabilità (2022-2024)."
  years: [2026]
  time_coverage:
    start_year: 2022
    end_year: 2024

raw:
  output_policy: overwrite
  sources:
    - name: "inps_assegno_unico"
      type: "script"
      args:
        command: "python3 extract.py raw.csv"
        output: "raw.csv"
      client:
        timeout: 120
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: all
    header: true
    encoding: "utf-8"
  required_columns: [anno, n_figli]
  validate:
    min_rows: 50

mart:
  tables:
    - name: "mart_au_regione"
      sql: "sql/mart_regione.sql"
    - name: "mart_au_isee"
      sql: "sql/mart_isee.sql"
  required_tables: [mart_au_regione]
  validate:
    table_rules:
      mart_au_regione:
        min_rows: 50

validation:
  fail_on_error: true

output:
  artifacts: "standard"
