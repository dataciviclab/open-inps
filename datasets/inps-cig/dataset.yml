root: "../../out"
schema_version: 1

dataset:
  name: "inps_cig"
  source_id: "inps"
  tags: [lavoro, inps, cig, cassa-integrazione, ammortizzatori]
  category: lavoro
  description: "CIG ore autorizzate per gestione, ramo, settore, regione (2023-2026)."
  years: [2026]
  time_coverage:
    start_year: 2023
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
    - name: "inps_cig"
      type: "script"
      args:
        command: "python3 extract.py raw.csv"
        output: "raw.csv"
      client:
        timeout: 120
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: all
    header: true
    encoding: "utf-8"
  required_columns: [anno, oretot]
  validate:
    min_rows: 100

mart:
  tables:
    - name: "mart_cig_regione"
      sql: "sql/mart_regione.sql"
    - name: "mart_cig_ramo"
      sql: "sql/mart_ramo.sql"
    - name: "mart_cig_mensile"
      sql: "sql/mart_mensile.sql"
  required_tables: [mart_cig_regione]
  validate:
    table_rules:
      mart_cig_regione:
        min_rows: 50

validation:
  fail_on_error: true

output:
  artifacts: "standard"
