root: "../../out"
schema_version: 1

dataset:
  name: "inps_dipendenti_pubblici"
  source_id: "inps"
  tags: [lavoro, inps, pubblico, dipendenti-pubblici]
  category: lavoro
  description: "Dipendenti pubblici: enti, retribuzioni e giornate lavorate per regione e forma giuridica (2022-2026)."
  years: [2026]
  time_coverage:
    start_year: 2022
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
    - name: "inps_dp"
      type: "script"
      args:
        command: "python3 extract.py raw.csv"
        output: "raw.csv"
      client:
        timeout: 120
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: all
    header: true
    encoding: "utf-8"
  required_columns: [anno, n_enti]
  validate:
    min_rows: 50

mart:
  tables:
    - name: "mart_dp_regione"
      sql: "sql/mart_regione.sql"
    - name: "mart_dp_forma_giuridica"
      sql: "sql/mart_forma_giuridica.sql"
  required_tables: [mart_dp_regione]
  validate:
    table_rules:
      mart_dp_regione:
        min_rows: 50

validation:
  fail_on_error: true

output:
  artifacts: "standard"
