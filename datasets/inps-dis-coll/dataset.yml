root: "../../out"
schema_version: 1

dataset:
  name: "inps_dis_coll"
  source_id: "inps"
  tags: [welfare, inps, dis-coll, disoccupazione, parasubordinati]
  category: welfare
  description: "DIS-COLL nazionale per sesso: beneficiari (397) e trattamenti (398), 2020-2024. Complemento NASpI per co.co.co. Solo grana nazionale (tagli territoriali API non additivi)."
  years: [2026]
  time_coverage:
    start_year: 2020
    end_year: 2024

raw:
  output_policy: overwrite
  sources:
    - name: "inps_dis_coll"
      type: "script"
      args:
        command: "python3 extract.py raw.csv"
        output: "raw.csv"
      client:
        timeout: 300
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: all
    header: true
    encoding: "utf-8"
  required_columns: [anno, tipo_dato, n_trattamenti]
  validate:
    min_rows: 16

mart:
  tables:
    - name: "mart_dis_coll_nazionale"
      sql: "sql/mart_nazionale.sql"
  required_tables: [mart_dis_coll_nazionale]
  validate:
    table_rules:
      mart_dis_coll_nazionale:
        min_rows: 16

validation:
  fail_on_error: true

output:
  artifacts: "standard"
