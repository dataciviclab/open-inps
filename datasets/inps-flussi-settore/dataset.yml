root: "../../out"
schema_version: 1

dataset:
  name: "inps_flussi_settore"
  source_id: "inps"
  tags: [lavoro, inps, settore, nace, mercato-lavoro]
  category: lavoro
  description: "Assunzioni e cessazioni per settore NACE Rev.2/2.1: nazionale e regionale (obs 407/406/528/530, 2014-2026)."
  years: [2026]
  time_coverage:
    start_year: 2014
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
    - name: "inps_flussi_settore"
      type: "script"
      args:
        command: "python3 extract.py raw.csv"
        output: "raw.csv"
      client:
        timeout: 600
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: all
    header: true
    encoding: "utf-8"
  required_columns: [anno, flusso, settore_codice, n_rapporti]
  validate:
    min_rows: 1000

mart:
  tables:
    - name: "mart_flussi_settore"
      sql: "sql/mart_nazionale.sql"
    - name: "mart_flussi_settore_regione"
      sql: "sql/mart_regione.sql"
  required_tables: [mart_flussi_settore, mart_flussi_settore_regione]
  validate:
    table_rules:
      mart_flussi_settore:
        min_rows: 500
      mart_flussi_settore_regione:
        min_rows: 500

validation:
  fail_on_error: true

output:
  artifacts: "standard"
