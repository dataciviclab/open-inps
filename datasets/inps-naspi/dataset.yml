root: "../../out"
schema_version: 1

dataset:
  name: "inps_naspi"
  source_id: "inps"
  tags: [lavoro, inps, naspi, disoccupazione, politiche-passive]
  category: lavoro
  description: "NASpI: beneficiari e trattamenti per sesso, eta, durata, regione (obs 395+396)."
  years: [2026]
  time_coverage:
    start_year: 2020
    end_year: 2024

raw:
  output_policy: overwrite
  sources:
    - name: "inps_naspi"
      type: "script"
      args:
        command: "python3 extract.py raw.csv"
        output: "raw.csv"
      client:
        timeout: 120
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: all
    header: true
    encoding: "utf-8"
  required_columns: [anno, sesso, n_beneficiari]
  validate:
    min_rows: 100

mart:
  tables:
    - name: "mart_naspi_regione"
      sql: "sql/mart_regione.sql"
    - name: "mart_naspi_eta"
      sql: "sql/mart_eta.sql"
    - name: "mart_naspi_durata"
      sql: "sql/mart_durata.sql"
  required_tables: [mart_naspi_regione]
  validate:
    table_rules:
      mart_naspi_regione:
        min_rows: 50

validation:
  fail_on_error: true

output:
  artifacts: "standard"
