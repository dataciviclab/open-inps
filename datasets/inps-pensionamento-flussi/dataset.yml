root: "../../out"
schema_version: 1

dataset:
  name: "inps_pensionamento_flussi"
  source_id: "inps"
  tags: [pensioni, inps, pensionamento, flussi, trimestrale]
  category: pensioni
  description: "Flussi trimestrali di pensionamento per anno decorrenza 2021-2026: regione, gestione e categoria (obs 475)."
  years: [2026]
  time_coverage:
    start_year: 2021
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
    - name: "inps_pensionamento_flussi"
      type: "script"
      args:
        command: "python3 extract.py raw.csv"
        output: "raw.csv"
      client:
        timeout: 300
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: all
    header: true
    encoding: "utf-8"
  required_columns: [anno, trimestre, n_pensioni]
  validate:
    min_rows: 500

mart:
  tables:
    - name: "mart_pensionamento_regione"
      sql: "sql/mart_regione.sql"
    - name: "mart_pensionamento_gestione"
      sql: "sql/mart_gestione.sql"
    - name: "mart_pensionamento_categoria"
      sql: "sql/mart_categoria.sql"
  required_tables:
    - mart_pensionamento_regione
    - mart_pensionamento_gestione
  validate:
    table_rules:
      mart_pensionamento_regione:
        min_rows: 500
      mart_pensionamento_gestione:
        min_rows: 100

validation:
  fail_on_error: true

output:
  artifacts: "standard"
