root: "../../out"
schema_version: 1

dataset:
  name: "inps_pensioni_vigenti"
  source_id: "inps"
  tags: [pensioni, inps, previdenza, welfare]
  category: pensioni
  description: "Stock di pensioni INPS in pagamento, per sesso, classe importo, eta e regione."
  years: [2026]
  time_coverage:
    start_year: 2022
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
    - name: "inps_vigenti"
      type: "script"
      args:
        command: "python3 extract.py raw.csv"
        output: "raw.csv"
      client:
        timeout: 120
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: all
    header: true
    encoding: "utf-8"
    decimal: ","
    thousands: "."
  required_columns: [anno, sesso, n_pensioni]
  validate:
    min_rows: 100

mart:
  tables:
    - name: "mart_vigenti_importo"
      sql: "sql/mart_importo.sql"
    - name: "mart_vigenti_eta"
      sql: "sql/mart_eta.sql"
    - name: "mart_vigenti_regione"
      sql: "sql/mart_regione.sql"
  required_tables: [mart_vigenti_importo, mart_vigenti_eta, mart_vigenti_regione]
  validate:
    table_rules:
      mart_vigenti_importo:
        min_rows: 10
      mart_vigenti_regione:
        min_rows: 10

validation:
  fail_on_error: true

output:
  artifacts: "standard"
