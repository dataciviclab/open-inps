root: "../../out"
schema_version: 1

dataset:
  name: "inps_rapporti_cessazioni"
  source_id: "inps"
  tags: [lavoro, inps, cessazioni, mercato-lavoro]
  category: lavoro
  description: "Cessazioni di rapporti di lavoro per provincia: tipologia e motivo, per sesso e eta (obs 490, 2014-2026)."
  years: [2026]
  time_coverage:
    start_year: 2014
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
    - name: "inps_cessazioni"
      type: "script"
      args:
        command: "python3 extract.py raw.csv"
        output: "raw.csv"
      client:
        timeout: 600
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: all
    header: true
    encoding: "utf-8"
  required_columns: [anno, sesso, n_cessazioni]
  validate:
    min_rows: 1000

mart:
  tables:
    - name: "mart_cessazioni_regione"
      sql: "sql/mart_regione.sql"
    - name: "mart_cessazioni_provincia"
      sql: "sql/mart_provincia.sql"
    - name: "mart_cessazioni_motivo"
      sql: "sql/mart_motivo.sql"
  required_tables: [mart_cessazioni_regione, mart_cessazioni_provincia]
  validate:
    table_rules:
      mart_cessazioni_regione:
        min_rows: 100
      mart_cessazioni_provincia:
        min_rows: 100

validation:
  fail_on_error: true

output:
  artifacts: "standard"
