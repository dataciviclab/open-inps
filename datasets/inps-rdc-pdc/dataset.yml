root: "../../out"
schema_version: 1

dataset:
  name: "inps_rdc_pdc"
  source_id: "inps"
  tags: [welfare, inps, rdc, pdc, reddito-cittadinanza]
  category: welfare
  description: "Nuclei beneficiari RdC/PdC con almeno una mensilità (obs 452, 2019-2023): misura, regione, componenti, disabili e minori."
  years: [2026]
  time_coverage:
    start_year: 2019
    end_year: 2023

raw:
  output_policy: overwrite
  sources:
    - name: "inps_rdc_pdc"
      type: "script"
      args:
        command: "python3 extract.py raw.csv"
        output: "raw.csv"
      client:
        timeout: 300
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: all
    header: true
    encoding: "utf-8"
  required_columns: [anno, misura, n_nuclei]
  validate:
    min_rows: 200

mart:
  tables:
    - name: "mart_rdc_pdc_nazionale"
      sql: "sql/mart_nazionale.sql"
    - name: "mart_rdc_pdc_regione"
      sql: "sql/mart_regione.sql"
    - name: "mart_rdc_pdc_componenti"
      sql: "sql/mart_componenti.sql"
    - name: "mart_rdc_pdc_fragili"
      sql: "sql/mart_fragili.sql"
  required_tables:
    - mart_rdc_pdc_nazionale
    - mart_rdc_pdc_regione
  validate:
    table_rules:
      mart_rdc_pdc_nazionale:
        min_rows: 8
      mart_rdc_pdc_regione:
        min_rows: 100

validation:
  fail_on_error: true

output:
  artifacts: "standard"
